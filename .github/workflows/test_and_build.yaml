name: Test and Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: cd modaINC && npm ci

      - name: Run tests
        run: cd modaINC && npm run test:run

      - name: Build project
        run: cd modaINC && npm run build
